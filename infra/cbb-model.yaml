name: cbb-model
region: us-east-1

resources:
  # DVC remote: versioned S3 bucket for training data snapshots
  - type: s3
    name: reilly-cbb-model-data
    versioning: true

  # ECR repo for the FastAPI serving container
  - type: ecr
    name: cbb-model-serve
    scan_on_push: true
    image_tag_mutability: IMMUTABLE
    lambda_access: true

  # IAM role for the Lambda serving function
  - type: iam_role
    name: cbb-model-lambda-role
    service: lambda.amazonaws.com
    policies:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess

  # Lambda serving function — added after first Docker image push to ECR
  # - type: lambda
  #   name: cbb-model-serve
  #   role: cbb-model-lambda-role
  #   ecr_repo: cbb-model-serve
  #   memory_mb: 1024
  #   timeout_s: 30
