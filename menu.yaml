# Unified platform manifest (menu.yaml) — the CBB tournament model as one file.
#
# Supersedes params.yaml: the same ML config, wrapped in the run `pipeline` and `recipes`
# the kitchen platform reads. Local-first by default — SQLite tracking + S3 artifacts, no
# AWS provisioning. Drive the whole loop with `kitchen menu run`; every `kitchen` command
# also reads this file directly.
#
# Persistent-backend (AWS) path: uncomment the `mlflow-backend` rds recipe + the `provision`
# pipeline step below and switch `mlflow.tracking_uri` to `{from_role: mlflow-backend}`.
# NB: provisioning infra from this menu needs its OWN Terraform state (a `project` distinct
# from `cbb-model`, which infra/cbb-model.yaml already owns) — see examples/persistent-backend.

project: cbb-model
region: us-east-1
experiment: cbb-tournament

pipeline: [train, evaluate]

recipes:
  # --- stages (project code; train runs features internally) ---
  features:
    kind: stage
    source: src/features/run.py
  train:
    kind: stage
    source: src/train/run.py
    args: ["--auto-promote"]      # loto_brier is lower-is-better; auto-detected from thresholds
  evaluate:
    kind: stage
    source: src/evaluate/run.py

  # --- persistent MLflow backend (AWS) — uncomment + add `provision` to the pipeline to use ---
  # mlflow-sg:
  #   kind: security_group
  #   ingress:
  #     - { port: 5432, cidr_blocks: ["<your-ip>/32"], description: PostgreSQL }
  # mlflow-backend:
  #   kind: rds
  #   role: mlflow-backend          # mlflow.tracking_uri: {from_role: mlflow-backend}
  #   instance_class: db.t4g.micro
  #   db_name: mlflow
  #   username: mlflow
  #   publicly_accessible: true
  #   security_groups: [mlflow-sg]

mlflow:
  tracking_uri: sqlite:///mlruns.db   # local store; champions persist on disk across runs
  model_artifact_path: cbb_model
  artifact_bucket: reilly-cbb-model-data

# --- ML config (carried verbatim from params.yaml) ---

data:
  source: local          # Kaggle CSVs are DVC-managed; run `dvc pull` to populate data/raw/
  path: data/raw

secrets:
  KENPOM_API_KEY:                  # resolved via kitchen.secrets (env/.env → AWS SM)
    aws_secret: kenpom_key         # Secrets Manager bundle (us-east-1)
    key: KENPOM_API_KEY            # field within the JSON bundle
    required: true
  # Kaggle is covered by `kitchen check`'s dedicated credential check (kaggle.json).

monitor:
  reference_file: reference.parquet   # seasons <= 2023 (training distribution)
  current_file: current.parquet       # seasons 2024-2025 (recent matchups)
  local_path: monitoring/drift.html
  drift_threshold: 0.05

submission:
  id_col: ID
  target_col: Pred
  competition: march-machine-learning-mania-2025
  sample_submission: SampleSubmissionStage1.csv
  message: "kitchen-platform baseline"

thresholds:
  loto_brier:
    max: 0.175            # CI fails if Brier degrades past this

features:
  raw_files:
    - MRegularSeasonDetailedResults
    - WRegularSeasonDetailedResults
    - MNCAATourneyDetailedResults
    - WNCAATourneyDetailedResults
    - MNCAATourneySeeds
    - WNCAATourneySeeds
    - MTeams
    - WTeams
    - MMasseyOrdinals
  processed_file: matchups.parquet
  z_features:
    - d_AdjEM
    - d_Elo
    - d_Quality
    - d_Form

model:
  variant: baseline
  eta: 0.01
  subsample: 0.6
  colsample_bynode: 0.8
  max_depth: 4
  num_rounds: 700
  seed_gap_men: 10
  seed_gap_women: 8
  calibrator_C: 1.0
  # XGBoost params kept constant (tuned in efficiency_approach.ipynb — depth=5 was +0.000498 worse)
  num_parallel_tree: 2
  min_child_weight: 4
  max_bin: 32

evaluate:
  holdout_season: 2026
  metrics_file: metrics.json

# Experiment variants — multi-field overlays applied with `kitchen run train --variant <name>`
# (tagged as model_variant so leaderboard/diff group them). The kenpom_rich variant adds the
# KenPom rich differentials that `kitchen run features` joins into matchups.
variants:
  kenpom_rich:
    model:
      variant: kenpom_rich     # so the run's model_variant tag matches (leaderboard/diff)
    feature_candidates:
      add: [d_kp_APL_Def, d_kp_APL_Off, d_kp_Luck, d_kp_SOS,
            d_kp_AvgHgt, d_kp_HgtEff, d_kp_Exp, d_kp_Bench, d_kp_Continuity]

# Feature columns sent to XGBoost (filtered to those present in matchup DataFrame)
feature_candidates:
  - men_women
  - d_AdjEM
  - d_AdjOE
  - d_AdjDE
  - d_AdjTempo
  - d_Rating
  - d_Elo
  - d_Quality
  - A_Seed
  - B_Seed
  - d_Seed
  - d_Form
  - d_MasseyRank
  - A_MasseyRank
  - B_MasseyRank
  - d_avg_PointDiff
  - d_avg_Score
  - d_eFGpct
  - d_TOpct
  - d_ORpct
  - d_FTrate
  - d_TSpct
  - d_opp_eFGpct
  - d_opp_TOpct
  - d_opp_ORpct
  - d_opp_FTrate
  - d_opp_TSpct
  - d_FG3pct
  - d_FG2pct
  - d_FTpct
  - d_opp_FG3pct
  - d_opp_FG2pct
  - d_opp_FTpct
  - d_3PArate
  - d_opp_3PArate
  - d_ASTrate
  - d_opp_ASTrate
  - d_Blkpct
  - d_Stlpct
  - d_NonStlTOpct
  - d_opp_NonStlTOpct
  - d_pct_pts_3
  - d_pct_pts_2
  - d_pct_pts_ft
  - d_opp_pct_pts_3
  - d_opp_pct_pts_2
  - d_opp_pct_pts_ft
  - d_quality_wtd_margin
