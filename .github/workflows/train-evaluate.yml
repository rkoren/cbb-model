name: Train & Evaluate

# Run on every push to main and PR.
# features → train → evaluate → post metrics as PR comment
# On main only: promote the best run to the champion alias
#
# Authentication (no long-lived AWS keys):
#   AWS_OIDC_ROLE_ARN (secret) — IAM role this workflow assumes via GitHub OIDC. Grant it
#     S3 read (DVC remote + MLflow artifacts) and Secrets Manager read (`kitchen secrets
#     iam-policy` generates the SM portion). CI stays red until this role exists.
#   KENPOM_API_KEY — resolved from AWS Secrets Manager via the params.yaml `secrets:` manifest
#     (`kitchen secrets export`), NOT a GitHub secret.
#   KAGGLE_USERNAME, KAGGLE_KEY (secrets) — Kaggle data validation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # manual "Run workflow" button

permissions:
  id-token: write       # assume the AWS role via OIDC
  contents: read
  pull-requests: write  # post the metrics PR comment

jobs:
  train-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      MLFLOW_TRACKING_URI: sqlite:///mlruns.db
      MLFLOW_EXPERIMENT: cbb-tournament
      MLFLOW_ARTIFACT_BUCKET: reilly-cbb-model-data
      AWS_REGION: us-east-1
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout kitchen-platform
        uses: actions/checkout@v4
        with:
          repository: rkoren/kitchen-platform
          ref: main
          path: kitchen-platform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # kitchen-platform is checked out above into ./kitchen-platform and installed editable
        # from its kitchen/ subdir (satisfies cbb-model's rkoren-kitchen dep). Locally you'd use
        # the sibling path: pip install -e ../kitchen-platform/kitchen -e . --quiet
        run: pip install -e ./kitchen-platform/kitchen -e . --quiet

      - name: Configure AWS credentials (OIDC)
        # Assumes the IAM role via GitHub OIDC — no long-lived keys. Exports temporary AWS_*
        # creds to the job env for DVC (S3), MLflow artifacts, and Secrets Manager.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Export secrets to env
        # Resolves the params.yaml `secrets:` manifest (KENPOM_API_KEY ← Secrets Manager) into
        # $GITHUB_ENV for the steps below, masked. $GITHUB_ENV applies to subsequent steps.
        run: kitchen secrets export

      - name: Pull data (DVC)
        run: dvc pull --quiet

      - name: Pre-flight check
        run: kitchen check

      - name: Build features
        run: kitchen run features

      - name: Train model (and promote if this run beats champion)
        # --auto-promote ensures a champion alias always exists before evaluate runs.
        # On the first CI run (no prior champion) it promotes unconditionally.
        # On subsequent runs it promotes only if loto_brier improves.
        run: |
          kitchen run train \
            --auto-promote \
            --promote-metric loto_brier \
            --lower-is-better \
            --model-name cbb-tournament-model

      - name: Evaluate champion model
        run: kitchen run evaluate --flavor sklearn

      - name: Show metrics
        run: kitchen report || cat metrics.json

      - name: Check thresholds
        run: |
          python - <<'EOF'
          import json, sys
          with open("metrics.json") as f:
              metrics = json.load(f)
          with open("params.yaml") as f:
              import yaml
              params = yaml.safe_load(f)
          thresholds = params.get("thresholds", {})
          failures = []
          for name, spec in thresholds.items():
              val = metrics.get(name)
              if val is None:
                  continue
              if isinstance(spec, (int, float)):
                  if val < spec:
                      failures.append(f"{name}={val:.6f} < required {spec:.6f}")
              else:
                  if spec.get("min") is not None and val < spec["min"]:
                      failures.append(f"{name}={val:.6f} < min {spec['min']:.6f}")
                  if spec.get("max") is not None and val > spec["max"]:
                      failures.append(f"{name}={val:.6f} > max {spec['max']:.6f}")
          if failures:
              print("THRESHOLD FAILURES:")
              for f in failures:
                  print(f"  ✗ {f}")
              sys.exit(1)
          print("All thresholds passed ✓")
          EOF

      # Post metrics as a PR comment (pull_request events only)
      - name: Comment metrics on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metrics = JSON.parse(fs.readFileSync('metrics.json', 'utf8'));
            const lines = Object.entries(metrics)
              .map(([k, v]) => `| \`${k}\` | ${typeof v === 'number' ? v.toFixed(6) : v} |`)
              .join('\n');
            const body = `## Model Evaluation Metrics\n\n| Metric | Value |\n|---|---|\n${lines}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # Promote the best run to champion alias on every push to main
  promote:
    needs: train-evaluate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MLFLOW_TRACKING_URI: sqlite:///mlruns.db
      MLFLOW_EXPERIMENT: cbb-tournament
      AWS_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout kitchen-platform
        uses: actions/checkout@v4
        with:
          repository: rkoren/kitchen-platform
          ref: main
          path: kitchen-platform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # See train-evaluate job: kitchen is built from source, not PyPI.
        run: pip install -e ./kitchen-platform/kitchen -e . --quiet

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Promote best run to champion
        run: |
          kitchen promote loto_brier \
            --lower-is-better \
            --model-name cbb-tournament-model \
            --experiment cbb-tournament
